name: Ошибка задания / Quest bug
description: Сообщить о вылете или сломанном задании / Report a crash or broken quest
title: '[Bug / Ошибка] '
labels: [bug]
body:
  - type: dropdown
    id: pack
    attributes:
      label: Пак / Pack
      options:
        - Патрульные контракты / Patrol Contracts
        - Штурмовые операции / Assault Operations
        - Оборона рубежей / Defend the Line
        - Научные экспедиции / Scientific Expeditions
        - Полевая работа / Field Work
        - FOMOD / установка / installation
    validations:
      required: true
  - type: input
    id: task
    attributes:
      label: Название задания / Quest name
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести / Reproduction steps
      description: Укажите квестодателя, локацию и действия. / Include the quest giver, location and actions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Лог и версия сборки / Log and versions
      description: Приложите конец xray-лога и версии GAMMA, WTF и аддона. / Attach the end of the xray log and list the GAMMA, WTF and addon versions.
    validations:
      required: true
  - type: checkboxes
    id: save
    attributes:
      label: Проверка сохранения / Save check
      options:
        - label: Ошибка повторяется после загрузки / The issue persists after reloading the save
