name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate tasks and installer
        shell: pwsh
        run: ./tools/validate.ps1
      - name: Test release build
        shell: pwsh
        run: ./tools/build-release.ps1 -Version 0.0.0-ci
