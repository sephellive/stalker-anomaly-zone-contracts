name: Validate / Проверка

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate tasks and installer / Проверить задания и установщик
        shell: pwsh
        run: ./tools/validate.ps1
      - name: Test RU and EN release builds / Проверить сборку RU и EN
        shell: pwsh
        run: ./tools/build-release.ps1 -Version 0.0.0-ci
