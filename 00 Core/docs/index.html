<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Контракты Зоны / Zone Contracts</title>
  <style>
    :root{--bg:#090b0c;--panel:#111517;--line:#293034;--muted:#9ca6a5;--text:#edf0ea;--amber:#d6a33b}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 70% 0,#182025 0,#090b0c 42%);color:var(--text);font-family:Segoe UI,Arial,sans-serif;line-height:1.55}a{color:inherit}
    .language-switch{position:fixed;z-index:20;top:18px;right:18px;display:flex;padding:4px;background:rgba(9,11,12,.9);border:1px solid var(--line);backdrop-filter:blur(8px)}.language-switch button{border:0;background:transparent;color:var(--muted);padding:8px 12px;font:700 .78rem/1 Segoe UI,sans-serif;cursor:pointer}.language-switch button.active{background:var(--amber);color:#0b0d0e}
    .hero{min-height:560px;display:grid;align-items:end;position:relative;background:linear-gradient(90deg,rgba(4,7,8,.96) 0,rgba(4,7,8,.72) 38%,rgba(4,7,8,.1) 75%),linear-gradient(0deg,var(--bg),transparent 45%),url('assets/zone-contracts-hero.png') center/cover no-repeat;border-bottom:1px solid var(--line)}
    .hero>div{width:min(1180px,calc(100% - 40px));margin:0 auto;padding:90px 0 70px}.eyebrow{text-transform:uppercase;letter-spacing:.23em;color:var(--amber);font-size:.75rem;font-weight:700}.hero h1{font:800 clamp(3rem,8vw,7rem)/.9 Impact,Arial Narrow,sans-serif;letter-spacing:.02em;max-width:880px;margin:.22em 0;text-transform:uppercase}.hero p{max-width:690px;color:#cad0cd;font-size:1.08rem}
    main{width:min(1180px,calc(100% - 40px));margin:0 auto;padding:46px 0 80px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:-75px;position:relative}.metric{background:rgba(17,21,23,.94);border:1px solid var(--line);padding:18px}.metric strong{display:block;color:var(--amber);font-size:1.7rem}.metric span{color:var(--muted);font-size:.85rem}
    .section-title{margin:62px 0 18px;font:700 1.7rem/1.1 Segoe UI,sans-serif}.principles,.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.note,.pack{background:var(--panel);border:1px solid var(--line);padding:20px}.note h3,.pack h3{margin:0 0 7px;font-size:1rem}.note p,.pack p{margin:0;color:var(--muted);font-size:.92rem}.pack{position:relative;padding-top:44px}.pack::before{content:attr(data-code);position:absolute;top:15px;left:20px;color:var(--amber);font:700 .7rem/1 monospace;letter-spacing:.15em}.pack small{display:block;color:#c8cfcb;margin-top:10px}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0}.toolbar input{flex:1;min-width:240px;background:#0d1112;border:1px solid var(--line);color:var(--text);padding:12px 14px;font:inherit}.filter{background:#111517;border:1px solid var(--line);color:var(--muted);padding:11px 13px;cursor:pointer}.filter.active{border-color:var(--amber);color:var(--text)}
    .quests{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.quest{background:linear-gradient(145deg,#121719,#0e1213);border:1px solid var(--line);padding:20px;display:grid;gap:13px}.quest header{display:flex;justify-content:space-between;gap:12px}.quest h3{margin:0;font-size:1.08rem}.tag{height:max-content;border:1px solid #3c4648;color:#bdc5c2;padding:3px 7px;font-size:.69rem;text-transform:uppercase;letter-spacing:.08em}.quest p{margin:0;color:var(--muted);font-size:.91rem}.meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.meta div{border-top:1px solid var(--line);padding-top:9px}.meta b{display:block;color:#d9ddd8;font-size:.79rem}.meta span{color:var(--muted);font-size:.75rem}.warning{border-left:3px solid var(--amber);background:#151612;padding:17px 20px;color:#c9ceca;margin-top:18px}.footer{border-top:1px solid var(--line);color:#7f8987;padding:30px 20px;text-align:center;font-size:.82rem}
    @media(max-width:850px){.metrics,.principles,.packs{grid-template-columns:repeat(2,1fr)}.quests{grid-template-columns:1fr}.hero{min-height:500px}.meta{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.metrics,.principles,.packs{grid-template-columns:1fr}.hero>div,main{width:min(100% - 24px,1180px)}.hero h1{font-size:3rem}.metric{padding:14px}.meta{grid-template-columns:1fr}.language-switch{top:10px;right:10px}}
  </style>
</head>
<body>
  <nav class="language-switch" aria-label="Language / Язык"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button></nav>
  <section class="hero"><div><div class="eyebrow">SEPHELLIVE Custom Base · WTF 4.2.3</div><h1 id="hero-title"></h1><p id="hero-text"></p></div></section>
  <main>
    <section class="metrics" id="metrics"></section>
    <h2 class="section-title" id="balance-title"></h2>
    <section class="principles" id="principles"></section>
    <h2 class="section-title" id="packs-title"></h2>
    <section class="packs" id="packs"></section>
    <h2 class="section-title" id="catalog-title"></h2>
    <div class="toolbar"><input id="search" type="search"><div id="filters"></div></div>
    <section class="quests" id="quests"></section>
    <div class="warning" id="warning"></div>
  </main>
  <footer class="footer" id="footer"></footer>
  <script>
    const common={
      ru:{
        pageTitle:'Контракты Зоны — каталог заданий',heroTitle:'Контракты Зоны',heroText:'Модульный набор повторяемых операций для существующего прохождения: редкие штурмы живых баз, оборона Ростка, научные вылазки, разведка и более сдержанная экономика обычных боевых контрактов.',
        metrics:[['24','задания в пяти паках'],['1–2','активных задания на пак'],['8 ч.–3 дня','общий кулдаун пака'],['×0,75','денежная награда рекомендуемого пресета']],
        balanceTitle:'Как устроен баланс',principles:[['Ротация предложений','У одного NPC показывается только один вариант каждого пака. Набор меняется по игровым дням и отличается у разных квестодателей.'],['Общий лимит','Нельзя держать больше пяти заданий этого набора одновременно. Штурмы и оборона ограничены одной активной операцией.'],['Общий кулдаун','Сдача задания временно закрывает весь тематический пак, а не только конкретный JSON-квест. Состояние хранится в сохранении.']],
        packsTitle:'Паки в FOMOD',packs:[['01 / ПАТРУЛЬ','Патрульные контракты','Усиленные столкновения на динамически выбранных позициях.','8 заданий · до 2 активных · кулдаун 12 часов'],['02 / ШТУРМ','Штурмовые операции','Зачистка реально существующего гарнизона и обязательный захват документов.','4 задания · 1 активное · кулдаун 3 дня'],['03 / ОБОРОНА','Оборона рубежей','Шесть тяжёлых волн после прибытия на рубеж; РПГ и экзоскелеты у «Монолита».','3 задания · 1 активное · кулдаун 2 дня'],['04 / НАУКА','Научные экспедиции','Лаборатории, редкие артефакты, биологические образцы и замеры.','5 заданий · до 2 активных · кулдаун 1 день'],['05 / ПОЛЕ','Полевая работа','Разведка маршрутов, усиленное снабжение, поиск курьера и зачистка логова.','4 задания · до 2 активных · кулдаун 8 часов']],
        catalogTitle:'Полный каталог',search:'Поиск по названию, цели или заказчику',filters:{all:'Все',patrol:'Патруль',assault:'Штурм',defense:'Оборона',science:'Наука',fieldwork:'Поле'},labels:['Заказчик','Награда','Повтор'],empty:'Ничего не найдено.',warning:'Суммы ниже указаны для рекомендуемого пресета FOMOD и коэффициента наград экономики 1,0. Глобальный коэффициент WTF и сложность экономики могут дополнительно изменить итог. Уже активные задания сохраняют старые параметры до сдачи; новые правила применяются к следующим контрактам.',footer:'«Контракты Зоны» 2.2 · Авторы:'
      },
      en:{
        pageTitle:'Zone Contracts — quest catalog',heroTitle:'Zone Contracts',heroText:'A modular set of repeatable operations for an existing playthrough: rare assaults against active bases, Rostok defense scenarios, scientific expeditions, field surveys and restrained rewards for ordinary combat contracts.',
        metrics:[['24','quests in five packs'],['1–2','active quests per pack'],['8 h–3 days','shared pack cooldown'],['×0.75','recommended monetary reward preset']],
        balanceTitle:'How the balance works',principles:[['Offer rotation','Each NPC shows only one option from every pack. The selection changes by in-game day and differs between quest givers.'],['Global limit','No more than five addon quests may be active at once. Assault and defense packs are limited to one active operation each.'],['Shared cooldown','Completing a quest temporarily closes its entire thematic pack rather than only one JSON quest. The state is stored in the save.']],
        packsTitle:'FOMOD packs',packs:[['01 / PATROL','Patrol Contracts','Reinforced encounters at dynamically selected positions.','8 quests · up to 2 active · 12-hour cooldown'],['02 / ASSAULT','Assault Operations','Clear an existing garrison and recover its documents.','4 quests · 1 active · 3-day cooldown'],['03 / DEFENSE','Defend the Line','Six heavy waves after arrival; Monolith brings RPGs and exoskeleton troops.','3 quests · 1 active · 2-day cooldown'],['04 / SCIENCE','Scientific Expeditions','Laboratories, rare artifacts, biological samples and measurements.','5 quests · up to 2 active · 1-day cooldown'],['05 / FIELD','Field Work','Longer route surveys, larger supplies, courier recovery and mutant-nest cleanup.','4 quests · up to 2 active · 8-hour cooldown']],
        catalogTitle:'Complete catalog',search:'Search by name, objective or quest giver',filters:{all:'All',patrol:'Patrol',assault:'Assault',defense:'Defense',science:'Science',fieldwork:'Field'},labels:['Quest giver','Reward','Repeat'],empty:'No quests found.',warning:'The amounts below use the recommended FOMOD preset and an economy reward factor of 1.0. Global WTF and economy difficulty multipliers may change the final amount. Already active quests retain their previous parameters until completion; new rules apply to later contracts.',footer:'Zone Contracts 2.2 · Credits:'
      }
    };
    const quests={
      ru:[
        ['patrol','Снять блокпост','Уничтожить две вражеские группы на ближайшем маршруте.','Торговцы','≈ 1 350 ₽ · 4 реп.','36 ч.'],['patrol','Перехват колонны','Уничтожить две группы противника в одной точке.','Лидеры','≈ 2 250 ₽ · 6 реп.','2 дня'],['patrol','Сорванная сделка','Накрыть встречу двух вооружённых групп.','Торговцы','≈ 2 400 ₽ · 6 реп.','2 дня'],['patrol','Два сектора','Зачистить две разные позиции за одну операцию.','Лидеры','≈ 2 850 ₽ · 7 реп.','2,5 дня'],['patrol','Опытная группа','Ликвидировать две усиленные ветеранские группы.','Механики','≈ 2 100 ₽ · 6 реп.','2,5 дня'],['patrol','Операция «Зачистка»','Уничтожить три группы на укреплённой позиции.','Лидеры','≈ 3 450 ₽ · 8 реп.','3 дня'],['patrol','Ложный сигнал','Найти источник ложных координат и уничтожить две группы засады.','Торговцы','≈ 1 875 ₽ · 5 реп.','36 ч.'],['patrol','Дальний рейд','Уничтожить две сильные группы в глубине Зоны.','Лидеры','≈ 4 200 ₽ · 10 реп.','4 дня'],
        ['assault','Архив Агропрома','Зачистить текущий военный гарнизон и забрать документы.','Враги военных','≈ 5 400 ₽ · 12 реп.','7 дней'],['assault','Чёрная бухгалтерия','Штурмовать базу бандитов в Тёмной долине и изъять журнал.','Враги бандитов','≈ 4 500 ₽ · 10 реп.','7 дней'],['assault','Книга частот','Зачистить базу «Свободы» и захватить книгу связи.','Враги «Свободы»','≈ 5 700 ₽ · 12 реп.','7 дней'],['assault','Архив контрактов','Штурмовать штаб наёмников в Мёртвом городе.','Враги наёмников','≈ 6 150 ₽ · 14 реп.','7 дней'],
        ['defense','Звери у южных ворот','Удержать южную заставу против шести волн вплоть до псевдогигантов.','Петренко или Бармен','≈ 4 200 ₽ · 10 реп.','5 дней'],['defense','Прорыв через Барьер','Уничтожить шесть групп «Монолита» с экзоскелетами и двумя РПГ.','Петренко или Бармен','≈ 5 850 ₽ · 14 реп.','6 дней'],['defense','Налёт на Росток','Отразить шесть тяжёлых групп бандитов.','Петренко или Бармен','≈ 3 600 ₽ · 9 реп.','5 дней'],
        ['science','Мёртвая телеметрия','Войти в X-16 и синхронизировать полевой регистратор.','Руководители учёных','≈ 3 150 ₽ · 9 реп. + препарат','4 дня'],['science','Эхо X-18','Проникнуть в X-18 и считать аварийный архив.','Руководители учёных','≈ 3 600 ₽ · 10 реп. + препарат','5 дней'],['science','Эталонный образец','Передать один из запрошенных редких артефактов.','Руководители учёных','≈ 4 200 ₽ · 11 реп. + контейнер','5 дней'],['science','Опасная биология','Доставить два редких органа опасных мутантов.','Учёные или медики','≈ 3 300 ₽ · 9 реп. + аптечка','4 дня'],['science','Треугольник измерений','Посетить пять контрольных точек с аппаратурой.','Учёные и техники','≈ 2 400 ₽ · 8 реп.','3 дня'],
        ['fieldwork','Проверка маршрута','Последовательно осмотреть пять позиций.','Лидеры или торговцы','≈ 1 800 ₽ · 5 реп.','2 дня'],['fieldwork','Расходный материал','Собрать увеличенную партию бинтов, аптечек или антирада.','Медики или торговцы','≈ 1 650 ₽ · 5 реп.','36 ч.'],['fieldwork','Пропавший курьер','Пережить засаду двух групп и найти пакет.','Торговцы или механики','≈ 2 100 ₽ · 6 реп.','2 дня'],['fieldwork','Разорить логово','Уничтожить три разные группы опасных мутантов.','Охотники, медики или лидеры','≈ 2 850 ₽ · 7 реп.','2,5 дня']
      ],
      en:[
        ['patrol','Break the Roadblock','Eliminate two hostile groups blocking a nearby route.','Traders','≈ 1,350 ₽ · 4 rep.','36 h'],['patrol','Intercept the Column','Eliminate two hostile groups gathered at one position.','Faction leaders','≈ 2,250 ₽ · 6 rep.','2 days'],['patrol','Broken Deal','Hit a meeting between two armed groups.','Traders','≈ 2,400 ₽ · 6 rep.','2 days'],['patrol','Two Sectors','Clear two separate positions in one operation.','Faction leaders','≈ 2,850 ₽ · 7 rep.','2.5 days'],['patrol','Experienced Cell','Eliminate two reinforced veteran groups.','Technicians','≈ 2,100 ₽ · 6 rep.','2.5 days'],['patrol','Operation Cleanup','Destroy three groups at a fortified position.','Faction leaders','≈ 3,450 ₽ · 8 rep.','3 days'],['patrol','False Signal','Find the false coordinates and eliminate two ambush groups.','Traders','≈ 1,875 ₽ · 5 rep.','36 h'],['patrol','Deep Raid','Destroy two strong groups deep inside the Zone.','Faction leaders','≈ 4,200 ₽ · 10 rep.','4 days'],
        ['assault','Agroprom Archive','Clear the current military garrison and recover its documents.','Enemies of the military','≈ 5,400 ₽ · 12 rep.','7 days'],['assault','Black Ledger','Assault the Dark Valley bandit base and seize its ledger.','Enemies of bandits','≈ 4,500 ₽ · 10 rep.','7 days'],['assault','Frequency Book','Clear the Freedom base and capture its signal book.','Enemies of Freedom','≈ 5,700 ₽ · 12 rep.','7 days'],['assault','Contract Archive','Assault the mercenary headquarters in Dead City.','Enemies of mercenaries','≈ 6,150 ₽ · 14 rep.','7 days'],
        ['defense','Beasts at the South Gate','Hold the south gate through six waves ending in pseudogiants.','Petrenko or Barkeep','≈ 4,200 ₽ · 10 rep.','5 days'],['defense','Breakthrough at the Barrier','Destroy six Monolith groups with exoskeleton troops and two RPG teams.','Petrenko or Barkeep','≈ 5,850 ₽ · 14 rep.','6 days'],['defense','Raid on Rostok','Repel six heavy bandit assault groups.','Petrenko or Barkeep','≈ 3,600 ₽ · 9 rep.','5 days'],
        ['science','Dead Telemetry','Enter X-16 and synchronize the field recorder.','Senior scientists','≈ 3,150 ₽ · 9 rep. + drug','4 days'],['science','Echo of X-18','Enter X-18 and download its emergency archive.','Senior scientists','≈ 3,600 ₽ · 10 rep. + drug','5 days'],['science','Reference Sample','Deliver one of the requested rare artifacts.','Senior scientists','≈ 4,200 ₽ · 11 rep. + container','5 days'],['science','Dangerous Biology','Deliver two rare organs from dangerous mutants.','Scientists or medics','≈ 3,300 ₽ · 9 rep. + medkit','4 days'],['science','Measurement Triangle','Visit five monitoring points with the equipment.','Scientists and technicians','≈ 2,400 ₽ · 8 rep.','3 days'],
        ['fieldwork','Route Survey','Inspect five positions in sequence.','Leaders or traders','≈ 1,800 ₽ · 5 rep.','2 days'],['fieldwork','Medical Consumables','Collect a larger shipment of bandages, medkits or antirad.','Medics or traders','≈ 1,650 ₽ · 5 rep.','36 h'],['fieldwork','Lost Courier','Survive a two-group ambush and recover the package.','Traders or technicians','≈ 2,100 ₽ · 6 rep.','2 days'],['fieldwork','Break the Nest','Destroy three different dangerous mutant groups.','Hunters, medics or leaders','≈ 2,850 ₽ · 7 rep.','2.5 days']
      ]
    };
    let language='ru',selected='all';
    const byId=id=>document.getElementById(id);
    const creditLinks='Sephellive, <a href="https://www.moddb.com/members/igigog" target="_blank" rel="noopener noreferrer">Igigog</a>, folk, Lasse Scheyde · <a href="https://github.com/sephellive/stalker-anomaly-zone-contracts" target="_blank" rel="noopener noreferrer">GitHub</a>';
    function storeLanguage(value){try{localStorage.setItem('zone-contracts-language',value)}catch{}}
    function savedLanguage(){try{return localStorage.getItem('zone-contracts-language')}catch{return null}}
    function renderQuests(){const c=common[language],term=byId('search').value.trim().toLowerCase();const list=quests[language].filter(x=>(selected==='all'||x[0]===selected)&&x.join(' ').toLowerCase().includes(term));byId('quests').innerHTML=list.map(x=>`<article class="quest"><header><h3>${x[1]}</h3><span class="tag">${c.filters[x[0]]}</span></header><p>${x[2]}</p><div class="meta"><div><b>${c.labels[0]}</b><span>${x[3]}</span></div><div><b>${c.labels[1]}</b><span>${x[4]}</span></div><div><b>${c.labels[2]}</b><span>${x[5]}</span></div></div></article>`).join('')||`<p>${c.empty}</p>`}
    function renderFilters(){const c=common[language];byId('filters').innerHTML=Object.entries(c.filters).map(([key,value])=>`<button class="filter${key===selected?' active':''}" type="button" data-pack="${key}">${value}</button>`).join('');document.querySelectorAll('.filter').forEach(button=>button.addEventListener('click',()=>{selected=button.dataset.pack;renderFilters();renderQuests()}))}
    function setLanguage(value){language=value;storeLanguage(value);const c=common[value];document.documentElement.lang=value;document.title=c.pageTitle;byId('hero-title').textContent=c.heroTitle;byId('hero-text').textContent=c.heroText;byId('metrics').innerHTML=c.metrics.map(x=>`<div class="metric"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('');byId('balance-title').textContent=c.balanceTitle;byId('principles').innerHTML=c.principles.map(x=>`<article class="note"><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('');byId('packs-title').textContent=c.packsTitle;byId('packs').innerHTML=c.packs.map(x=>`<article class="pack" data-code="${x[0]}"><h3>${x[1]}</h3><p>${x[2]}</p><small>${x[3]}</small></article>`).join('');byId('catalog-title').textContent=c.catalogTitle;byId('search').placeholder=c.search;byId('search').setAttribute('aria-label',c.search);byId('warning').textContent=c.warning;byId('footer').innerHTML=`${c.footer} ${creditLinks}`;document.querySelectorAll('[data-lang]').forEach(button=>{const active=button.dataset.lang===value;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))});renderFilters();renderQuests()}
    document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>setLanguage(button.dataset.lang)));byId('search').addEventListener('input',renderQuests);const initial=savedLanguage()||((navigator.language||'').toLowerCase().startsWith('ru')?'ru':'en');setLanguage(initial);
  </script>
</body>
</html>
